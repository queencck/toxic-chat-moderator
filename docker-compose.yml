services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  api:
    build: ./django-ninja
    env_file:
      - ./django-ninja/.env
    environment:
      DB_HOST: db
      # Local development only. Gives real tracebacks instead of bare 500s.
      # Production sets this False (the settings default) -- the debug page
      # leaks source, local variables and settings to whoever triggers it.
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,api.localhost,admin.localhost,127.0.0.1
      DJANGO_PARENT_HOST: localhost
      DJANGO_CORS_ORIGINS: http://localhost:3000
      DJANGO_CSRF_ORIGINS: http://localhost:3000
      ML_MODEL_SERVER_URL: inference:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  inference:
    build: ./inference-engine
    ports:
      # Published so the load test can hit the model directly. Only the api
      # container needs it otherwise, over the compose network.
      - "8080:8080"
    # Comment this block out to run on CPU. Requires the NVIDIA container
    # toolkit on the host; without it the container fails to start.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # python rather than curl: the slim base image has no HTTP client.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      # The model takes ~20s to load; failures before this don't count.
      start_period: 60s

  bot:
    build: ./bot-services
    env_file:
      - ./bot-services/.env
    environment:
      # Reach the api over the compose network, not the published port.
      # The Host header is what django-hosts routes on.
      DJANGO_API_URL: http://api:8000/v1
      DJANGO_API_HOST: api.localhost
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
